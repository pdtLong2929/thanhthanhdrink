<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu - Thanh Thanh Trà</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css?v=18">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="icon" type="image/png" href="images/logo.png?v=2">
</head>

<body>
    <!-- Header -->
    <div id="app-header"></div>

    <!-- Main Content -->
    <main style="padding-top: 150px; padding-bottom: 80px; min-height: 70vh; background-color: var(--cream-bg);">
        <div class="container text-center">
            <span class="badge-outline" style="margin-bottom: 20px;" data-content="storyBadge">VỀ CHÚNG TÔI</span>
            <h1
                style="color: var(--primary-dark); margin-bottom: 30px; font-family: 'Playfair Display', serif; font-size: 2.5rem;" data-content="storyTitle">
                Câu Chuyện Thương Hiệu</h1>
            <p
                style="color: var(--text-main); font-size: 1.1rem; max-width: 800px; margin: 0 auto 40px auto; line-height: 1.8;" data-content="storyDesc">
                Chào mừng bạn đến với trang Giới thiệu chi tiết. Khu vực này đang chờ bạn điền thêm những câu chuyện thú
                vị về sự hình thành, quy trình chọn lọc trái cây hay sứ mệnh của Thanh Thanh Trà!
            </p>
            <a href="index.html" class="btn-outline pill-btn" style="display: inline-block;">Quay lại Trang chủ</a>
        </div>
    </main>

    <!-- Footer -->
    <div id="app-footer"></div>

    <!-- Modals -->
    <div id="app-modals"></div>
    
    <!-- JS -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/firebase-service.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
