<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật Dinh Dưỡng</title>
</head>
<body>
    <h1>Trình Cập Nhật Dinh Dưỡng (Từ File PDF Chuẩn)</h1>
    <p>Công cụ này sẽ tự động cập nhật chính xác <strong>Calo, Protein, Carb, Fat</strong> cho từng món nước lên Firebase.</p>
    
    <button id="update-btn" style="padding: 10px 20px; font-size: 16px; background: #0b5c47; color: white; border: none; border-radius: 5px; cursor: pointer;">Cập Nhật Dinh Dưỡng</button>
    <p id="status" style="margin-top: 20px; font-weight: bold;"></p>

    <!-- Firebase SDKs -->
    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const currentTags = {
            'p1': ['MỚI'], 'p2': ['BÁN CHẠY'], 'p3': ['BÁN CHẠY'], 'p4': ['BÁN CHẠY'], 'p5': ['ĐẶC TRƯNG'],
            'p6': ['MỚI'], 'p7': ['ÍT CALO'], 'p8': ['MỚI'], 'p9': ['BÁN CHẠY'], 'p10': ['ĐẶC TRƯNG'],
            'p11': ['BÁN CHẠY'], 'p12': ['SIGNATURE'], 'p13': ['MỚI'], 'p14': ['THANH LỌC'], 'p15': ['ÍT NGỌT'],
            'p16': ['BÁN CHẠY'], 'p17': ['ĐẶC TRƯNG']
        };

        const updatedMacros = {
            'p1': { M: {calo: 34, protein: 0.6, carbs: 8.3, fat: 0.2}, L: {calo: 48, protein: 0.8, carbs: 11.6, fat: 0.3} },
            'p2': { M: {calo: 31, protein: 0.6, carbs: 7.7, fat: 0.0}, L: {calo: 44, protein: 0.9, carbs: 11.1, fat: 0.1} },
            'p3': { M: {calo: 31, protein: 0.6, carbs: 7.6, fat: 0.2}, L: {calo: 44, protein: 0.8, carbs: 10.8, fat: 0.3} },
            'p4': { M: {calo: 56, protein: 1.1, carbs: 13.5, fat: 0.4}, L: {calo: 80, protein: 1.5, carbs: 19.4, fat: 0.6} },
            'p5': { M: {calo: 47, protein: 0.7, carbs: 12.0, fat: 0.2}, L: {calo: 68, protein: 1.0, carbs: 17.2, fat: 0.3} },
            'p6': { M: {calo: 49, protein: 1.0, carbs: 11.1, fat: 0.7}, L: {calo: 70, protein: 1.4, carbs: 15.8, fat: 0.9} },
            'p7': { M: {calo: 27, protein: 0.6, carbs: 6.9, fat: 0.1}, L: {calo: 39, protein: 0.8, carbs: 9.9, fat: 0.1} },
            'p8': { M: {calo: 81, protein: 2.7, carbs: 16.5, fat: 0.9}, L: {calo: 119, protein: 3.9, carbs: 24.5, fat: 1.3} },
            'p9': { M: {calo: 122, protein: 3.0, carbs: 18.7, fat: 5.1}, L: {calo: 198, protein: 4.5, carbs: 30.6, fat: 8.4} },
            'p10': { M: {calo: 73, protein: 2.8, carbs: 13.9, fat: 0.9}, L: {calo: 105, protein: 3.9, carbs: 20.4, fat: 1.3} },
            'p11': { M: {calo: 83, protein: 2.6, carbs: 18.0, fat: 0.8}, L: {calo: 124, protein: 3.7, carbs: 27.4, fat: 1.2} },
            'p12': { M: {calo: 98, protein: 2.7, carbs: 22.1, fat: 0.8}, L: {calo: 147, protein: 3.9, carbs: 33.4, fat: 1.2} },
            'p13': { M: {calo: 122, protein: 4.3, carbs: 16.9, fat: 5.0}, L: {calo: 183, protein: 6.4, carbs: 23.9, fat: 8.2} },
            'p14': { M: {calo: 99, protein: 4.2, carbs: 13.6, fat: 3.5}, L: {calo: 147, protein: 6.2, carbs: 20.2, fat: 5.3} },
            'p15': { M: {calo: 117, protein: 4.1, carbs: 19.2, fat: 3.5}, L: {calo: 173, protein: 6.2, carbs: 27.9, fat: 5.2} },
            'p16': { M: {calo: 90, protein: 3.9, carbs: 12.0, fat: 3.5}, L: {calo: 135, protein: 5.9, carbs: 18.0, fat: 5.3} },
            'p17': { M: {calo: 76, protein: 4.1, carbs: 14.3, fat: 3.6}, L: {calo: 117, protein: 5.7, carbs: 13.1, fat: 5.2} }
        };

        document.getElementById('update-btn').addEventListener('click', async () => {
            const statusText = document.getElementById('status');
            statusText.innerText = 'Đang tiến hành đăng nhập Admin... Vui lòng không đóng trang.';
            
            try {
                // Đăng nhập trước khi ghi
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);

                statusText.innerText = 'Đăng nhập thành công! Đang tải dữ liệu dinh dưỡng chuẩn lên...';

                for (const [p_id, macros] of Object.entries(updatedMacros)) {
                    const docRef = doc(db, 'products', p_id);
                    const newTags = [...currentTags[p_id], `${macros.M.calo} kcal`];
                    
                    // Chỉ update trường dinh dưỡng và tags
                    await setDoc(docRef, {
                        nutritionM: macros.M,
                        nutritionL: macros.L,
                        tags: newTags
                    }, { merge: true });
                    
                    console.log(`Đã cập nhật dinh dưỡng cho ${p_id}`);
                }
                statusText.innerText = 'Cập nhật thành công! Đã đồng bộ số liệu dinh dưỡng chuẩn xác tuyệt đối.';
                statusText.style.color = 'green';
            } catch (error) {
                console.error("Lỗi:", error);
                statusText.innerText = 'Cập nhật thất bại. Chi tiết lỗi: ' + error.message;
                statusText.style.color = 'red';
            }
        });
    </script>
</body>
</html>
