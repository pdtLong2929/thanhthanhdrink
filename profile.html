<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - Thanh Thanh Trà</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=18">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .profile-section {
            padding: 120px 0 60px 0;
            min-height: calc(100vh - 300px);
            background-color: var(--cream-bg);
        }

        .profile-container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .profile-sidebar {
            width: 280px;
            flex-shrink: 0;
        }

        .profile-content {
            flex: 1;
            background: var(--white);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 40px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--white);
            padding: 20px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .sidebar-item {
            padding: 12px 16px;
            border-radius: var(--border-radius-sm);
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .sidebar-item:hover,
        .sidebar-item.active {
            background-color: var(--mint-bg);
            color: var(--primary-dark);
        }

        .sidebar-item i {
            font-size: 1.2rem;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Profile Info */

        @media (max-width: 768px) {
            .profile-container {
                flex-direction: column;
            }
            .profile-sidebar {
                width: 100%;
            }
            .profile-content {
                padding: 20px;
            }
            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .info-header {
                flex-direction: column;
                text-align: center;
            }
        }

        .info-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.1);
        }

        .info-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }

        .info-text h3 {
            font-size: 1.5rem;
            color: var(--primary-dark);
        }

        .info-text p {
            color: var(--text-muted);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }

        .empty-state i {
            font-size: 4rem;
            color: rgba(60, 115, 99, 0.2);
            margin-bottom: 16px;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 24px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .profile-container {
                flex-direction: column;
            }

            .profile-sidebar {
                width: 100%;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="images/logo.png?v=2">
</head>

<body>
    <!-- Header -->
    <div id="app-header"></div>

    <main>
        <section class="profile-section">
            <div class="profile-container">
                <div class="profile-sidebar">
                    <div class="sidebar-menu">
                        <div class="sidebar-item active" data-target="tab-info">
                            <i class="ph ph-user"></i> Thông tin tài khoản
                        </div>
                        <div class="sidebar-item" data-target="tab-cart">
                            <i class="ph ph-shopping-cart"></i> Giỏ hàng
                        </div>
                        <div class="sidebar-item" data-target="tab-history">
                            <i class="ph ph-receipt"></i> Lịch sử mua hàng
                        </div>
                        <div class="sidebar-item" onclick="handleLogout()" style="color: #ef4444; font-weight: 600;">
                            <i class="ph ph-sign-out"></i> Đăng xuất
                        </div>
                    </div>
                </div>

                <div class="profile-content">
                    <!-- Tab Info -->
                    <div id="tab-info" class="tab-pane active">
                        <h2 class="section-title" style="font-size: 1.8rem; margin-bottom: 20px;">Hồ sơ của tôi</h2>
                        <div class="info-header">
                            <img src="https://placehold.co/150" alt="Avatar" class="info-avatar" id="profile-avatar">
                            <div class="info-text">
                                <h3 id="profile-name">Đang tải...</h3>
                                <p id="profile-email">Đang tải...</p>
                            </div>
                        </div>
                        <div style="max-width: 400px;">
                            <div style="margin-bottom: 20px;">
                                <label
                                    style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main);">Họ
                                    và tên</label>
                                <input type="text" id="profile-input-name" disabled
                                    style="width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.1); background: #f9f9f9;">
                            </div>
                            <div style="margin-bottom: 20px;">
                                <label
                                    style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main);">Email</label>
                                <input type="text" id="profile-input-email" disabled
                                    style="width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.1); background: #f9f9f9;">
                            </div>
                        </div>
                    </div>

                    <!-- Tab Cart -->
                    <div id="tab-cart" class="tab-pane">
                        <h2 class="section-title" style="font-size: 1.8rem; margin-bottom: 20px;">Giỏ hàng</h2>
                        <div id="cart-empty-state" class="empty-state">
                            <i class="ph ph-shopping-bag-open"></i>
                            <p>Đơn hàng bạn mua/thêm sẽ xuất hiện tại đây.</p>
                            <a href="menu.html" class="btn-primary pill-btn">Xem thực đơn</a>
                        </div>
                        <div id="cart-content" style="display: none;">
                            <div id="cart-items-container"
                                style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px;">
                                <!-- Cart items will be injected here -->
                            </div>
                            <div
                                style="border-top: 2px dashed rgba(0,0,0,0.1); padding-top: 20px; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <span style="color: var(--text-muted); font-weight: 500;">Tổng cộng:</span>
                                    <h3 id="cart-total"
                                        style="color: var(--primary-dark); font-size: 1.5rem; margin-top: 5px;">0đ</h3>
                                </div>
                                <button id="checkout-btn" class="btn-primary pill-btn"
                                    style="padding: 12px 30px; font-size: 1.1rem;">Thanh toán</button>
                            </div>
                        </div>
                    </div>

                    <!-- Tab History -->
                    <div id="tab-history" class="tab-pane">
                        <h2 class="section-title" style="font-size: 1.8rem; margin-bottom: 20px;">Lịch sử mua hàng</h2>
                        <div id="history-empty-state" class="empty-state">
                            <i class="ph ph-receipt"></i>
                            <p>Đơn hàng bạn mua/thêm sẽ xuất hiện tại đây.</p>
                            <a href="menu.html" class="btn-primary pill-btn">Đặt hàng ngay</a>
                        </div>
                        <div id="history-items-container" style="display: none; flex-direction: column; gap: 15px;">
                            <!-- History items will be injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="app-footer"></div>

    <!-- Modals -->
    <div id="app-modals"></div>

    <!-- Order Details Modal -->
    <div id="order-details-modal" class="modal-overlay" style="display: none;">
        <div class="auth-modal-box" style="max-width: 500px; text-align: left; padding: 30px;">
            <button class="auth-modal-close" onclick="document.getElementById('order-details-modal').style.display='none'" style="position:absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-main);"><i class="ph ph-x"></i></button>
            <h2 style="margin-bottom: 20px; font-family: 'Playfair Display', serif; color: var(--primary-dark); text-align: center;">Chi tiết đơn hàng</h2>
            
            <div id="order-details-content">
                <!-- Content injected by JS -->
            </div>
            
            <button onclick="document.getElementById('order-details-modal').style.display='none'" class="btn-outline pill-btn" style="width: 100%; margin-top: 20px; padding: 12px; font-weight: 600;">Đóng</button>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/profile.js"></script>
    <script type="module">
        import { loadLayout } from './js/layout.js';
        document.addEventListener('DOMContentLoaded', loadLayout);
    </script>


    <!-- Checkout Modal for Cart -->
    <div id="cart-checkout-modal" class="modal-overlay" style="display: none; z-index: 9999;">
        <div class="auth-modal-box">
            <button class="auth-modal-close checkout-close" onclick="document.getElementById('cart-checkout-modal').style.display='none'">
                <i class="ph ph-x"></i>
            </button>
            <h2 class="auth-title">Thông tin giao hàng</h2>

            <form id="checkout-form" onsubmit="event.preventDefault(); window.submitCartOrder();">
                <div class="form-group">
                    <label>Họ và tên người nhận</label>
                    <input type="text" id="checkout-name" required placeholder="Nhập họ và tên" class="form-input">
                </div>

                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="tel" id="checkout-phone" required placeholder="Nhập số điện thoại" pattern="[0-9]{10,11}" class="form-input">
                </div>

                <div class="form-group checkout-address-group">
                    <label>Địa chỉ giao hàng</label>
                    <textarea id="checkout-address" required placeholder="Nhập số nhà, tên đường, phường/xã..." rows="3" class="form-input form-textarea"></textarea>
                </div>

                <button type="submit" id="checkout-submit-btn" class="btn-primary pill-btn checkout-submit">Xác nhận đặt hàng</button>
            </form>
        </div>
    </div>

</body>

</html>
